grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

prometheus:
  prometheusSpec:
    retention: 7d
    ruleSelector:
      matchLabels:
        release: monitoring
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
      - alertmanager-webhook
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: webhook
      group_by: [alertname, namespace, pod]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: webhook
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-webhook/webhook-url
            send_resolved: true
